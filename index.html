<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quote Generator</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="cursor-orb" aria-hidden="true"></div>

  <div class="blob blob--orange" aria-hidden="true"></div>
  <div class="blob blob--pink" aria-hidden="true"></div>
  <div class="blob blob--blue" aria-hidden="true"></div>

  <main class="container">
    <p id="quoteCounter" class="quote-Counter"></p>
    
    <div class="frame-oval" aria-hidden="true"></div>
    <blockquote class="young-serif-regular" id="quoteText">Aquí va la frase</blockquote>
    <p id="quoteAuthor">— Autor</p>
    <button id="newQuoteBtn" class="quote-btn">NUEVA AFIRMACIÓN</button>
    
  </main>
<div class="noise" aria-hidden="true"></div>
 <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="script.js"></script>
</body>
</html>
